[project]
name = "meters-llm"
version = "0.1.0"
description = "Meters product card builder with LLM (Ollama)"
readme = "README.md"
authors = [
    { name = "trolley813", email = "trolleybus.1329@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "gradio>=6.31.0",
    "ollama>=0.6.3",
    "python-dotenv>=1.2.4"
]

[project.scripts]
meters-llm = "meters_llm:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
